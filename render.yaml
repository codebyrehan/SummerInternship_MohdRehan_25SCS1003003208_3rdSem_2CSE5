services:
  - type: web
    name: quickhire-ai-career-suite
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build && cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false